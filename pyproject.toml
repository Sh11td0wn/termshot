[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termshot"
version = "1.0"
description = "Capture command output as clean terminal screenshots"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel Manzano" }
]
keywords = ["terminal", "screenshot", "ansi", "pty", "pentest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Terminals"
]
dependencies = [
  "rich>=13.0",
  "CairoSVG>=2.7"
]

[project.scripts]
termshot = "termshot:main"

[tool.setuptools]
py-modules = ["termshot"]
